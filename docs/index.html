<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ouvre les fenêtres</title>
<style>
  :root { --bg: #f6f4ef; --card: #ffffff; --ink: #1f2328; --muted: #5d6470; --line: #dedad2; --accent: #2f6f4f; --soft: #e8f1ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181c; --card: #1e2227; --ink: #e8e6e3; --muted: #a0a6ae; --line: #33383f; --accent: #6fbf94; --soft: #1f2d26; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  .lang { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
          padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer; flex: none; }
  .pick { display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line);
          border-radius: 16px; padding: 18px; margin: 12px 0; color: var(--ink); text-decoration: none; }
  .pick:active, .pick:hover { border-color: var(--accent); background: var(--soft); }
  .ico { font-size: 34px; flex: none; width: 52px; text-align: center; }
  .pick b { display: block; font-size: 1.15rem; }
  .pick span.d { color: var(--muted); font-size: .95rem; }
  .arrow { margin-left: auto; color: var(--accent); font-size: 1.4rem; font-weight: 700; }
  .what { color: var(--muted); font-size: .95rem; margin-top: 22px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
    </div>
    <button class="lang" id="lang" type="button">English</button>
  </header>

  <a class="pick" href="echo.html">
    <span class="ico">🔵</span>
    <span><b data-t="echo"></b><span class="d" data-t="echoD"></span></span>
    <span class="arrow">›</span>
  </a>
  <a class="pick" href="phone.html">
    <span class="ico">📱</span>
    <span><b data-t="google"></b><span class="d" data-t="googleD"></span></span>
    <span class="arrow">›</span>
  </a>

  <p class="what" data-t="what"></p>
</main>
<script>
const T = {
  fr: { title: "Ouvre les fenêtres", lead: "Qu'est-ce que tu as à la maison?",
        echo: "Amazon Echo (Alexa)", echoD: "L'Echo s'allume en jaune ou parle quand c'est le temps.",
        google: "Pas d'Echo? Ton téléphone", googleD: "Android ou iPhone : une notification, qui peut même être lue à voix haute.",
        what: "☀️ Un petit service gratuit qui t'avertit quand il fait assez doux et sec pour ouvrir les fenêtres, et te rappelle de les fermer avant la pluie ou le froid." },
  en: { title: "Open the windows", lead: "What do you have at home?",
        echo: "Amazon Echo (Alexa)", echoD: "Your Echo glows yellow or talks when it's time.",
        google: "No Echo? Your phone", googleD: "Android or iPhone: a notification, which can even be read out loud.",
        what: "☀️ A small free service that tells you when it's mild and dry enough to open the windows, and reminds you to close them before rain or cold." },
};
let lang = "fr";
function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T[lang][el.dataset.t]; });
  document.getElementById("lang").textContent = lang === "fr" ? "English" : "Français";
}
document.getElementById("lang").onclick = () => { lang = lang === "fr" ? "en" : "fr"; render(); };
render();
</script>
</body>
</html>
