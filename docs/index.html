<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ouvre les fenêtres</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f2328; --muted: #5d6470;
    --line: #dedad2; --accent: #2f6f4f; --accent-ink: #ffffff; --soft: #e8f1ec; --warn: #9a3b1b;
    --tap: #e8590c; --alexa: #232f3e; --alexa-ink: #ffffff; --alexa-blue: #00a8e1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181c; --card: #1e2227; --ink: #e8e6e3; --muted: #a0a6ae;
            --line: #33383f; --accent: #6fbf94; --accent-ink: #0f1a14; --soft: #1f2d26; --warn: #f0a07f;
            --tap: #ff8a4c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .lang { border: 1px solid var(--line); background: var(--card); color: var(--ink);
          border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer; flex: none; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
            padding: 18px; margin: 14px 0; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; display: flex; gap: 10px; align-items: center; }
  .n { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
       background: var(--soft); color: var(--accent); font-weight: 700; font-size: .95rem; flex: none; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  input { width: 100%; font: inherit; padding: 12px; border-radius: 10px;
          border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  button.main, button.ghost { font: inherit; font-weight: 600; border-radius: 10px; padding: 12px 16px; cursor: pointer; }
  button.main { background: var(--accent); color: var(--accent-ink); border: 0; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  button.wide { width: 100%; margin-top: 14px; }
  .hint { color: var(--muted); font-size: .92rem; margin: 6px 0 0; }
  .do { margin: 4px 0 0; }
  .err { color: var(--warn); font-size: .95rem; margin: 8px 0 0; min-height: 1px; }
  .places { list-style: none; padding: 0; margin: 10px 0 0; }
  .places button { width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--bg);
                   border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 4px 0; cursor: pointer; }
  .places button[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); font-weight: 600; }
  .places button[aria-pressed="true"]::after { content: "  ✓"; color: var(--accent); }
  details summary { cursor: pointer; font-weight: 600; }
  pre { white-space: pre-wrap; word-break: break-all; background: var(--bg); border: 1px solid var(--line);
        border-radius: 10px; padding: 12px; font-size: .85rem; margin: 10px 0; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btns button { flex: 1; min-width: 140px; }
  #result { display: none; }

  /* --- tap-by-tap guide --- */
  .guide { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--bg); }
  .gstep { font-size: .85rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
  .gtext { font-size: 1.05rem; font-weight: 600; margin: 4px 0 12px; min-height: 3em; }
  .gtext b { color: var(--tap); }
  .phone { position: relative; width: 230px; height: 360px; margin: 0 auto; border-radius: 28px;
           border: 8px solid #1b1b1f; background: #fff; color: #1f2328; overflow: hidden;
           font-size: 13px; line-height: 1.3; box-shadow: 0 6px 18px rgba(0,0,0,.15); }
  .ph-top { background: var(--alexa); color: var(--alexa-ink); padding: 14px 12px 10px; font-weight: 700;
            display: flex; justify-content: space-between; align-items: center; }
  .ph-body { padding: 10px 12px; }
  /* new dark Alexa+ app */
  .ax { position: absolute; inset: 0; background: #020b14; color: #e8edf2; }
  .ax-top { display: grid; grid-template-columns: 26px 1fr 26px; align-items: center; padding: 12px 8px 8px;
            font-weight: 700; text-align: center; }
  .ax-top > span:first-child { color: #aab4bf; font-size: 20px; text-align: left; }
  .ax-body { padding: 2px 10px; }
  .ax-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .ax-tile { background: #18202a; border-radius: 9px; padding: 8px 6px; font-size: 10.5px; min-height: 34px; }
  .ax-row { padding: 8px 4px; border-bottom: 1px solid #1c2531; }
  .ax-search { background: #2a2f36; color: #aab4bf; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
  .ax-chips { display: flex; gap: 4px; margin-bottom: 8px; }
  .ax-chips span { border: 1px solid #1e5a99; color: #3fb0e6; border-radius: 12px; padding: 3px 7px; font-size: 10px; }
  .ax-card { border-radius: 10px; background: #18202a; height: 44px; margin: 0 0 6px; }
  .ax-tabs { display: flex; justify-content: space-between; font-size: 11px; color: #8b98a6; margin-bottom: 8px;
             border-bottom: 1px solid #1c2531; }
  .ax-tabs b { color: #fff; border-bottom: 2px solid #3fb0e6; padding-bottom: 5px; }
  .ax-blk { border-radius: 9px; overflow: hidden; margin-bottom: 8px; }
  .ax-blk h6 { background: #4a4f57; margin: 0; padding: 5px 10px; font-size: 10px; letter-spacing: .12em; }
  .ax-blk div { background: #272c33; padding: 9px 10px; color: #3fb0e6; }
  .ax-blk div.set { color: #e8edf2; }
  .ax-save { background: #1554c0; color: #fff; border-radius: 20px; text-align: center; font-weight: 700;
             padding: 8px; margin-top: 6px; }
  .ax-ask { position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 20px; background: #000;
            border: 1px solid #1e6bff; box-shadow: 0 0 10px rgba(30,107,255,.55); padding: 7px 12px;
            color: #8b98a6; font-size: 12px; }
  .ax-ask b { color: #3fb0e6; margin-right: 8px; }
  .ax-hero { height: 92px; background: radial-gradient(120% 90% at 50% 0, #0b4aa8, #031026); display: flex;
             justify-content: space-between; align-items: flex-start; padding: 12px 10px; }
  .ax-circ { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
             background: rgba(255,255,255,.12); font-size: 13px; }
  .ax-msg { background: #18202a; border-radius: 12px; padding: 7px 10px; margin: 6px 30px 6px 0; }
  .ax-msg.me { background: #1554c0; margin: 6px 0 6px 50px; }
  .ax-send { position: absolute; right: 4px; top: 3px; width: 22px; height: 22px; border-radius: 50%;
             background: #1e6bff; color: #fff; display: grid; place-items: center; font-weight: 700; }
  .ph-card { border-radius: 10px; background: #eef3f7; height: 54px; margin: 0 0 8px; }
  .ph-list div { padding: 9px 4px; border-bottom: 1px solid #eee; }
  .ph-search { border: 1px solid #bbb; border-radius: 8px; padding: 8px; margin-bottom: 10px; }
  .ph-skill { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; }
  .ph-icon { width: 42px; height: 42px; border-radius: 10px; background: #f5b800; display: grid;
             place-items: center; font-size: 20px; flex: none; }
  .ph-btn { background: var(--alexa-blue); color: #fff; text-align: center; font-weight: 700;
            border-radius: 20px; padding: 10px; margin-top: 16px; font-size: 12px; }
  .ph-mail { border-bottom: 1px solid #eee; padding: 8px 2px; }
  .ph-mail small { color: #666; display: block; }
  .ph-code { font-family: ui-monospace, monospace; background: #fff6d6; padding: 6px; border-radius: 6px;
             word-break: break-all; margin-top: 8px; }
  .tap { position: relative; outline: 3px solid var(--tap); outline-offset: 2px; border-radius: 10px;
         animation: pulse 1.4s ease-in-out infinite; }
  .tap::after { content: "👆"; position: absolute; right: 8px; bottom: -22px; font-size: 26px;
                animation: poke 1.4s ease-in-out infinite; z-index: 2; }
  .ax-ask.tap, .ax-send.tap { position: absolute; }
  @keyframes pulse { 50% { outline-color: transparent; } }
  @keyframes poke { 50% { transform: translateY(-5px); } }
  @media (prefers-reduced-motion: reduce) { .tap, .tap::after { animation: none; } }
  .ax-sub { display: block; color: #3fb0e6; font-weight: 400; font-size: 10px; }
  .ax-btn { display: inline-block; background: #272c33; border-radius: 14px; padding: 8px 12px; margin: 4px 0 0;
            font-size: 11.5px; position: relative; }
  .ax-typed { color: #fff; display: inline-block; max-width: 78%; vertical-align: top; }
  .ax-field { background: #2a2f36; border-radius: 8px; padding: 8px 10px; text-align: left; font-weight: 400;
              display: flex; justify-content: space-between; }
  .ax-res { display: flex; gap: 8px; align-items: center; padding: 6px 2px; border-bottom: 1px solid #1c2531;
            font-size: 9.5px; line-height: 1.25; }
  .ax-res i { color: #e8edf2; font-size: 10px; }
  .ax-res small { color: #8b98a6; font-size: 9.5px; }
  .ax-ic { width: 30px; height: 30px; border-radius: 50%; background: #e8edf2; display: grid; place-items: center;
           flex: none; font-size: 15px; }
  .ax-kbd { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: #0b0f14; color: #8b98a6;
            display: flex; justify-content: space-between; align-items: center; padding: 0 12px; font-size: 11px; }
  .ax-key { background: #cdb8ff; color: #20104d; border-radius: 50%; width: 34px; height: 34px; display: grid;
            place-items: center; font-size: 15px; }
  .intro p { margin: 6px 0; }
  .ph-url { background: #e9ecef; color: #333; font-size: 11px; padding: 10px 10px 8px; }
  .ph-url span { display: block; background: #fff; border-radius: 12px; padding: 4px 10px; }
  .ph-field { border: 1px solid #bbb; border-radius: 6px; padding: 7px; margin: 4px 0 8px; }
  .ph-small { font-size: 11px; color: #666; }
  .ph-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 4px;
            border-bottom: 1px solid #eee; }
  .ph-amz { background: #ffd814; color: #111; text-align: center; font-weight: 700; border-radius: 8px;
            padding: 10px; margin-top: 14px; }
  .ph-vmbtn { background: #6c3ce1; color: #fff; text-align: center; font-weight: 700; border-radius: 8px;
              padding: 9px; margin-top: 10px; font-size: 12px; }
  .ph-id { font-family: ui-monospace, monospace; background: #f1ecff; padding: 3px 6px; border-radius: 5px; }
  .guide a { color: var(--tap); font-weight: 700; }
  .gnav { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
  .gnav button { flex: 1; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dots span.on { background: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
    </div>
    <button class="lang" id="lang" type="button">English</button>
  </header>

  <section class="intro">
    <h2 data-t="whatTitle"></h2>
    <p data-t="what1"></p>
    <p data-t="what2"></p>
    <p data-t="what3"></p>
    <p data-t="what4"></p>
  </section>

  <section>
    <h2><span class="n">1</span><span data-t="s1"></span></h2>
    <label for="name" data-t="nameLabel"></label>
    <input id="name" autocomplete="off" maxlength="30">
    <p class="hint" data-t="nameHint"></p>
  </section>

  <section>
    <h2><span class="n">2</span><span data-t="s2"></span></h2>
    <p class="do" data-t="townDo"></p>
    <label for="town" data-t="townLabel"></label>
    <div class="row">
      <input id="town" autocomplete="off">
      <button class="main" id="search" type="button" data-t="search"></button>
    </div>
    <ul class="places" id="places"></ul>
    <p class="err" id="townErr"></p>
    <details id="manual">
      <summary data-t="manual"></summary>
      <label for="lat" data-t="lat"></label><input id="lat" inputmode="decimal">
      <label for="lon" data-t="lon"></label><input id="lon" inputmode="decimal">
      <p class="hint" data-t="manualHint"></p>
    </details>
  </section>

  <section>
    <h2><span class="n">3</span><span data-t="s3"></span></h2>
    <p class="hint" data-t="guideIntro"></p>
    <div class="guide" data-guide="steps" data-done="code"></div>
    <label for="code" data-t="codeLabel"></label>
    <div class="row">
      <input id="code" autocomplete="off" spellcheck="false">
      <button class="ghost" type="button" data-paste="code" data-t="paste"></button>
    </div>
    <p class="hint" data-t="nmHint"></p>
    <button class="ghost wide" id="testNm" type="button" data-t="testNm"></button>
    <p class="hint" id="nmResult" aria-live="polite"></p>
  </section>

  <section>
    <details>
      <summary data-t="vmTitle"></summary>
      <p class="hint" data-t="vmHint"></p>
      <div class="guide" data-guide="vmSteps" data-done="vmDevice"></div>
      <label for="vmDevice" data-t="vmDevice"></label>
      <div class="row">
        <input id="vmDevice" autocomplete="off" spellcheck="false">
        <button class="ghost" type="button" data-paste="vmDevice" data-t="paste"></button>
      </div>
      <label for="vmToken" data-t="vmToken"></label>
      <div class="row">
        <input id="vmToken" autocomplete="off" spellcheck="false">
        <button class="ghost" type="button" data-paste="vmToken" data-t="paste"></button>
      </div>
      <button class="ghost wide" id="testVm" type="button" data-t="testVm"></button>
      <p class="hint" id="vmResult" aria-live="polite"></p>
    </details>
  </section>

  <button class="main wide" id="make" type="button" data-t="make"></button>
  <p class="err" id="makeErr"></p>

  <section id="result">
    <h2><span class="n">4</span><span data-t="s4"></span></h2>
    <p data-t="sendIt"></p>
    <pre id="out"></pre>
    <div class="btns">
      <button class="main" id="share" type="button" data-t="share"></button>
      <button class="ghost" id="copy" type="button" data-t="copy"></button>
    </div>
    <p class="hint" id="copied"></p>
    <p class="hint" id="sendHow"></p>
    <p class="hint" data-t="after"></p>
  </section>
</main>

// Drawn Alexa app screens (new dark Alexa+ app). `tap` marks what to press.
function screen(kind, a) {
  const web = (url, body) => `<div class="ph-url"><span>🔒 ${url}</span></div><div class="ph-body">${body}</div>`;
  const top = (t, right = "") => `<div class="ph-top"><span>${t}</span>${right}</div>`;
  const app = (t, body, right = "<span></span>", ask = true) => `<div class="ax"><div class="ax-top"><span>‹</span><span>${t}</span>${right}</div>
    <div class="ax-body">${body}</div>${ask ? `<div class="ax-ask"><b>ɑ</b>${a.ask}</div>` : ""}</div>`;
  const list = (rows, hit, cls = "ax-row") => rows.map((r, k) => `<div class="${cls}${k === hit ? " tap" : ""}">${r}</div>`).join("");
  const vmBg = ' style="background:#6c3ce1"';
  // Alexa+ home: ≡ menu top left, Ask Alexa bar at the bottom.
  const home = (menu) => `<div class="ax"><div class="ax-hero"><span class="ax-circ${menu ? " tap" : ""}">≡</span><span>
    <span class="ax-circ">🔔</span> <span class="ax-circ">L</span></span></div>
    <div class="ax-body"><div class="ax-row" style="border:0;font-weight:700">💡 ${a.devices}</div>
    <div class="ax-tile" style="margin-bottom:5px">Alexa Voice Monkey v3</div><div class="ax-tile">Echo Show</div></div>
    <div class="ax-ask${menu ? "" : " tap"}"><b>ɑ</b>${a.ask}</div></div>`;
  // Alexa+ chat: earlier lines, then the typed text waiting to be sent.
  const chat = (said, typed) => `<div class="ax"><div class="ax-top"><span>‹</span><span>Alexa+</span><span></span></div>
    <div class="ax-body">${said.map(([me, t]) => `<div class="ax-msg${me ? " me" : ""}">${t}</div>`).join("")}</div>
    <div class="ax-ask"><b>ɑ</b><span style="color:#fff">${typed}</span><span class="ax-send tap">↑</span></div></div>`;
  // Alexa+ chat as in the real app: "Settings Management" header, typed text or an answer button to tap.
  const chat2 = (said, typed, btn) => `<div class="ax"><div class="ax-top"><span>⌄</span><span>${a.setMgmt}<span class="ax-sub">Alexa+ Preview</span></span><span></span></div>
    <div class="ax-body">${said.map(([me, t]) => `<div class="ax-msg${me ? " me" : ""}">${t}</div>`).join("")}
    ${btn ? `<div class="ax-btn tap">↗ ${btn} ›</div>` : ""}</div>
    <div class="ax-ask"><b>ɑ</b>${typed ? `<span class="ax-typed">${typed}</span><span class="ax-send tap">↑</span>` : a.ask}</div></div>`;
  // Search page: field with the typed words, suggestions under it, keyboard with the search key.
  const search = (q, sugg) => `<div class="ax"><div class="ax-top" style="grid-template-columns:22px 1fr"><span>‹</span><span class="ax-field">${q}<i>✕</i></span></div>
    <div class="ax-body" style="margin-top:6px">${sugg.map((x, k) => `<div class="ax-row${k === 0 ? " tap" : ""}">${x}</div>`).join("")}</div>
    <div class="ax-kbd"><span>⌨ English</span><span class="ax-key">🔍</span></div></div>`;
  // Search Results page: rows = [icon, name, spoken phrase]; `hit` is the row to tap.
  const results = (q, rows, hit) => `<div class="ax"><div class="ax-top"><span>‹</span><span>${a.searchRes}</span><span></span></div>
    <div class="ax-body"><div class="ax-search">🔍 ${q}</div>${rows.map(([ic, t, ph], k) =>
      `<div class="ax-res${k === hit ? " tap" : ""}"><span class="ax-ic">${ic}</span><span><small>${t}</small><br><i>“${ph}”</i></span></div>`).join("")}</div>
    <div class="ax-ask"><b>ɑ</b>${a.ask}</div></div>`;
  switch (kind) {
    case "chatSkill": return chat2([], "Skill");
    case "chatSkillBtn": return chat2([[1, "Skill"], [0, a.skillSays]], "", a.skillsInt);
    case "chatRt": return chat2([], a.navCmd);
    case "chatRtBtn": return chat2([[1, a.navCmd], [0, a.rtSays]], "", a.manageRt);
    case "searchVm": return search("Voice monkey", ["voice monkey", "voice monkey v3"]);
    case "searchNm": return search("Notify Me", ["notify me"]);
    case "resVm": return results("voice monkey", [["🐵", "Monkey Sounds", "Alexa, open monkey sounds"],
        ["🐒", "Voice Monkey - Smart Home + Routine Triggers + TTS", "Alexa, open Voice Monkey"],
        ["🙊", "Compliment Monkey - Monkey Say Monkey True!", "Alexa ask compliment monkey for a funny compliment"]], 1);
    case "resNm": return results("notify me", [["🔔", "Notify Me", "Alexa, open Notify Me"],
        ["📣", "…", "Alexa, open …"], ["📣", "…", "Alexa, open …"]], 0);
    case "nmEnable": return app("Notify Me", `<div class="ph-skill"><div class="ph-icon">🔔</div>
        <div><b>Notify Me</b><br><small style="color:#8b98a6">${a.by}</small></div></div><div class="ph-btn tap">${a.enable}</div>`);
    case "home": return home(false);
    case "homeMenu": return home(true);
    case "askNm": return chat([], "Enable Notify Me");
    case "askOpen": return chat([], "Open Notify Me");
    case "askVm": return chat([], "Enable Voice Monkey");
    case "moreRt": return app(a.more, `<div class="ax-grid">${list(["♫ " + a.music, "◯ " + a.comm, "☰ " + a.lists, "☑ " + a.rem,
        "↻ " + a.routines, "⏰ " + a.alarms, "▦ " + a.explore, "★ " + a.skills], 4, "ax-tile")}</div>
        <div class="ax-row" style="margin-top:6px">⚙ ${a.settings}</div><div class="ax-row">↺ ${a.chats}</div>`);
    case "vmEnable": return app("Voice Monkey", `<div class="ph-skill"><div class="ph-icon"${vmBg}>🐒</div>
        <div><b>Voice Monkey</b></div></div><div class="ph-btn">${a.enable}</div><div class="ph-amz tap">amazon · ${a.allow}</div>`);
    case "vmLogin": return web("app.voicemonkey.io", `<div style="text-align:center;margin-top:40px"><div style="font-size:40px">🐒</div><b>Voice Monkey</b></div>
        <div class="ph-amz tap">Sign in with Amazon</div>`);
    case "vmSpeakers": return web("app.voicemonkey.io/speakers", `<b>Speakers</b><p class="ph-small">0 speakers</p><div class="ph-vmbtn tap">+ Add New Speaker</div>`);
    case "vmCreate": return web("app.voicemonkey.io/speakers", `<b>Add New Speaker</b><div class="ph-small" style="margin-top:10px">Name</div>
        <div class="ph-field">Echo</div><div class="ph-vmbtn tap">Create Speaker</div>`);
    case "vmCard": return web("app.voicemonkey.io/speakers", `<b>Speakers</b><div class="ph-field" style="margin-top:10px"><b>Echo</b><br>
        <span class="ph-id tap">echo-ab12c</span><div class="ph-small" style="margin-top:22px">Test · Edit</div></div>`);
    case "rtNew": return app(a.routines, `<div class="ax-tabs"><b>${a.tabs[0]}</b><span>${a.tabs[1]}</span><span>${a.tabs[2]}</span></div>
        <div class="ax-card"></div><div class="ax-card"></div>`, `<span class="tap" style="font-size:18px">⊕</span>`);
    case "rtWhen": return app(a.when, list([a.voice, a.sched, "🏠 " + a.smart], 2)
        + `<div style="padding:4px 0 6px 18px;color:#8b98a6;font-size:11px">› Alexa Voice Monkey v3<br>› VM Speakers<br>› Echo</div>`
        + list([a.sound, a.alarmsE], -1));
    case "rtAction": return app(a.addNew, list([a.info, a.news, a.skillsA + " › Voice Monkey", a.sounds], 2));
    case "rtFrom": return app(a.newRoutine, `<div class="ax-blk"><h6>${a.whenH}</h6><div class="set">Alexa Voice Monkey v3: Echo</div></div>
        <div class="ax-blk"><h6>${a.willH}</h6><div class="set">Voice Monkey<br><small style="color:#8b98a6">${a.from}: <b style="color:#fff">${a.echoName}</b></small></div></div>
        <div class="ax-save tap">${a.save}</div>`, "<span></span>", false);
    case "vmTest": return web("app.voicemonkey.io/speakers", `<b>Speakers</b><div class="ph-field" style="margin-top:10px"><b>Echo</b><br>
        <span class="ph-id">echo-ab12c</span><div style="margin-top:10px"><span class="ph-vmbtn tap" style="display:inline-block;margin:0;padding:6px 14px">Test</span></div></div>
        <div style="text-align:center;margin-top:16px;font-size:22px">🔊</div>`);
    case "vmToken": return web("app.voicemonkey.io/tokens", `<b>API Tokens</b><div class="ph-small" style="margin-top:8px">Name</div>
        <div class="ph-field">fenetres</div><div class="ph-vmbtn">Create Token</div>
        <div class="ph-row" style="margin-top:10px"><span class="ph-id">a1b2c3••••</span><span class="tap" style="padding:2px 6px">⧉</span></div>`);
    case "mail": return top(a.inbox) + `<div class="ph-body"><div class="ph-mail"><b>Notify Me</b><small>${a.subject}</small></div>
        <div class="ph-code tap">••••••••••••••••<br><small>${a.code}</small></div>
        <p style="margin-top:34px;color:#666;font-size:12px">${a.hold}</p></div>`;
  }
}

let lang = "fr", place = null, message = "";
const $ = (id) => document.getElementById(id);

// One tap-by-tap guide per [data-guide] box; data-guide names the step list in T.
const guides = [...document.querySelectorAll("[data-guide]")].map((box) => {
  box.innerHTML = `<div class="gstep"></div><div class="gtext"></div><div class="phone" aria-hidden="true"></div>
    <div class="dots"></div><div class="gnav"><button class="ghost" type="button"></button><button class="main" type="button"></button></div>`;
  const g = { key: box.dataset.guide, i: 0 }, [prev, next] = box.querySelectorAll("button");
  g.draw = () => {
    const t = T[lang], steps = t[g.key], n = steps.length, [text, kind] = steps[g.i];
    box.querySelector(".gstep").textContent = t.stepOf(g.i + 1, n);
    box.querySelector(".gtext").innerHTML = text;
    box.querySelector(".phone").innerHTML = screen(kind, t.app);
    box.querySelector(".dots").innerHTML = steps.map((_, k) => `<span class="${k === g.i ? "on" : ""}"></span>`).join("");
    prev.textContent = t.prev; prev.disabled = g.i === 0;
    next.textContent = g.i === n - 1 ? t.done : t.next;
  };
  prev.onclick = () => { if (g.i > 0) { g.i--; g.draw(); } };
  next.onclick = () => { if (g.i < T[lang][g.key].length - 1) { g.i++; g.draw(); } else { $(box.dataset.done).focus(); } };
  return g;
});

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T[lang][el.dataset.t]; });
  $("lang").textContent = lang === "fr" ? "English" : "Français";
  guides.forEach((g) => g.draw());
  if (message) build();
}
$("lang").onclick = () => { lang = lang === "fr" ? "en" : "fr"; render(); };

function slug(s) {
  return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase()
          .replace(/[^A-Z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 30);
}

async function search() {
  const q = $("town").value.trim();
  $("townErr").textContent = ""; $("places").innerHTML = ""; place = null;
  if (!q) return;
  try {
    const url = "https://geocoding-api.open-meteo.com/v1/search?count=6&format=json&language=" + lang
              + "&name=" + encodeURIComponent(q);
    const j = await (await fetch(url)).json();
    if (!j.results || !j.results.length) { $("townErr").textContent = T[lang].errSearch; return; }
    j.results.forEach((r) => {
      const li = document.createElement("li"), b = document.createElement("button");
      b.type = "button";
      b.textContent = [r.name, r.admin1, r.country].filter(Boolean).join(", ");
      b.onclick = () => {
        place = { lat: r.latitude, lon: r.longitude, tz: r.timezone || "America/Toronto" };
        document.querySelectorAll(".places button").forEach((x) => x.setAttribute("aria-pressed", x === b));
      };
      li.appendChild(b); $("places").appendChild(li);
    });
    if (j.results.length === 1) $("places").querySelector("button").click();
  } catch (e) { $("townErr").textContent = T[lang].errNet; $("manual").open = true; }
}
$("search").onclick = search;
$("town").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });

document.querySelectorAll("[data-paste]").forEach((b) => {
  const field = $(b.dataset.paste);
  b.onclick = async () => {
    try { field.value = (await navigator.clipboard.readText()).trim(); }
    catch (e) { $("makeErr").textContent = T[lang].errPaste; field.focus(); }
  };
});

function where() {
  const lat = parseFloat($("lat").value.replace(",", ".")), lon = parseFloat($("lon").value.replace(",", "."));
  if ($("manual").open && isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
    return { lat, lon, tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "America/Toronto" };
  }
  return place;
}

function build() {
  const t = T[lang], name = $("name").value.trim(), id = slug(name), p = where();
  const code = $("code").value.trim(), vt = $("vmToken").value.trim(), vd = $("vmDevice").value.trim();
  const err = !id ? t.errName : !p ? t.errTown : !(code || (vt && vd)) ? t.errCode : "";
  $("makeErr").textContent = err;
  if (err) { $("result").style.display = "none"; message = ""; return; }
  const home = { name, lat: Math.round(p.lat * 100) / 100, lon: Math.round(p.lon * 100) / 100, tz: p.tz,
                 mode: code ? "auto" : "announce" };  // no Notify Me: speak every alert
  if (code) home.notifyme = code;
  if (vt && vd) { home.vm_token = vt; home.vm_device = vd; }
  message = t.msgHead + "\n" + t.secretName + ": HOME_" + id + "\n" + t.value + ":\n" + JSON.stringify(home);
  $("out").textContent = message;
  $("share").style.display = navigator.share ? "" : "none";
  $("sendHow").textContent = navigator.share ? t.sendShare : t.sendCopy;
  $("result").style.display = "block";
}
$("make").onclick = () => { build(); if (message) $("result").scrollIntoView({ behavior: "smooth" }); };

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(message); }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("out"));
              getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); }
  $("copied").textContent = T[lang].copied;
};
$("share").onclick = () => navigator.share({ text: message }).catch(() => {});

// Quick tests: send one alert straight to the Echo, same calls as alert.py.
async function test(btn, out, run) {
  btn.disabled = true; $(out).textContent = T[lang].testing;
  try { $(out).textContent = await run(T[lang]); }
  catch (e) { $(out).textContent = T[lang].errNet; }
  btn.disabled = false;
}
$("testNm").onclick = () => test($("testNm"), "nmResult", async (t) => {
  const code = $("code").value.trim();
  if (!code) return t.nmNeed;
  // Notify Me sends no CORS headers: the alert still goes out, but the reply can't be read.
  await fetch("https://api.notifymyecho.com/v1/NotifyMe?" + new URLSearchParams(
    { notification: t.testSpeech, title: t.testTitle, accessCode: code }), { mode: "no-cors" });
  return t.nmSent;
});
$("testVm").onclick = () => test($("testVm"), "vmResult", async (t) => {
  const token = $("vmToken").value.trim(), device = $("vmDevice").value.trim();
  if (!token || !device) return t.vmNeed;
  const r = await fetch("https://api-v3.voicemonkey.io/announce", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token, device, speech: t.testSpeech,
                           text_display: t.testTitle + "\n" + t.testSpeech, display_seconds: 15 }),
  });
  return r.ok ? t.vmSent : t.vmBad;
});

render();
</script>
</body>
</html>
