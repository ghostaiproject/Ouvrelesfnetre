<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ouvre les fenêtres</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f2328; --muted: #5d6470;
    --line: #dedad2; --accent: #2f6f4f; --accent-ink: #ffffff; --soft: #e8f1ec; --warn: #9a3b1b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181c; --card: #1e2227; --ink: #e8e6e3; --muted: #a0a6ae;
            --line: #33383f; --accent: #6fbf94; --accent-ink: #0f1a14; --soft: #1f2d26; --warn: #f0a07f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .lang { border: 1px solid var(--line); background: var(--card); color: var(--ink);
          border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
            padding: 18px; margin: 14px 0; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; display: flex; gap: 10px; align-items: center; }
  .n { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
       background: var(--soft); color: var(--accent); font-weight: 700; font-size: .95rem; flex: none; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  input { width: 100%; font: inherit; padding: 12px; border-radius: 10px;
          border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  button.main, button.ghost { font: inherit; font-weight: 600; border-radius: 10px; padding: 12px 16px; cursor: pointer; }
  button.main { background: var(--accent); color: var(--accent-ink); border: 0; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.wide { width: 100%; margin-top: 14px; }
  ol.how { padding-left: 1.2rem; margin: 6px 0 0; }
  ol.how li { margin: 4px 0; }
  .hint { color: var(--muted); font-size: .92rem; margin: 6px 0 0; }
  .err { color: var(--warn); font-size: .95rem; margin: 8px 0 0; min-height: 1px; }
  .places { list-style: none; padding: 0; margin: 10px 0 0; }
  .places button { width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--bg);
                   border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 4px 0; cursor: pointer; }
  .places button[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
  .picked { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--soft); }
  details summary { cursor: pointer; font-weight: 600; }
  pre { white-space: pre-wrap; word-break: break-all; background: var(--bg); border: 1px solid var(--line);
        border-radius: 10px; padding: 12px; font-size: .85rem; margin: 10px 0; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btns button { flex: 1; min-width: 140px; }
  #result { display: none; }
  .ok { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
    </div>
    <button class="lang" id="lang" type="button">English</button>
  </header>

  <section>
    <h2><span class="n">1</span><span data-t="s1"></span></h2>
    <label for="name" data-t="nameLabel"></label>
    <input id="name" autocomplete="off" maxlength="30">
    <p class="hint" data-t="nameHint"></p>
  </section>

  <section>
    <h2><span class="n">2</span><span data-t="s2"></span></h2>
    <label for="town" data-t="townLabel"></label>
    <div class="row">
      <input id="town" autocomplete="off">
      <button class="main" id="search" type="button" data-t="search"></button>
    </div>
    <ul class="places" id="places"></ul>
    <p class="err" id="townErr"></p>
    <details id="manual">
      <summary data-t="manual"></summary>
      <label for="lat" data-t="lat"></label><input id="lat" inputmode="decimal">
      <label for="lon" data-t="lon"></label><input id="lon" inputmode="decimal">
      <p class="hint" data-t="manualHint"></p>
    </details>
  </section>

  <section>
    <h2><span class="n">3</span><span data-t="s3"></span></h2>
    <ol class="how">
      <li data-t="nm1"></li>
      <li data-t="nm2"></li>
      <li data-t="nm3"></li>
    </ol>
    <label for="code" data-t="codeLabel"></label>
    <input id="code" autocomplete="off" spellcheck="false">
    <p class="hint" data-t="nmHint"></p>
  </section>

  <section>
    <details>
      <summary data-t="vmTitle"></summary>
      <p class="hint" data-t="vmHint"></p>
      <label for="vmToken" data-t="vmToken"></label><input id="vmToken" autocomplete="off" spellcheck="false">
      <label for="vmDevice" data-t="vmDevice"></label><input id="vmDevice" autocomplete="off" spellcheck="false">
    </details>
  </section>

  <button class="main wide" id="make" type="button" data-t="make"></button>
  <p class="err" id="makeErr"></p>

  <section id="result">
    <h2><span class="n">4</span><span data-t="s4"></span></h2>
    <p data-t="sendIt"></p>
    <pre id="out"></pre>
    <div class="btns">
      <button class="main" id="share" type="button" data-t="share"></button>
      <button class="ghost" id="copy" type="button" data-t="copy"></button>
    </div>
    <p class="hint" id="copied"></p>
    <p class="hint" data-t="after"></p>
  </section>
</main>

<script>
const T = {
  fr: {
    title: "Ouvre les fenêtres",
    lead: "Ton Echo t'avertit quand c'est le bon moment pour ouvrir les fenêtres, et te rappelle de les fermer s'il va pleuvoir ou faire froid. Ça prend 5 minutes.",
    s1: "Ton nom", nameLabel: "Un nom pour ta maison", nameHint: "Ex. : Maman, Julie, Chalet. Lettres et chiffres seulement.",
    s2: "Ta ville", townLabel: "Nom de ta ville", search: "Chercher",
    manual: "Ta ville n'apparaît pas?", lat: "Latitude", lon: "Longitude",
    manualHint: "Dans Google Maps, appuie longtemps sur ta maison : les deux nombres en haut sont la latitude et la longitude.",
    s3: "Ton Echo",
    nm1: "Dans l'app Alexa : Plus → Skills et jeux → cherche « Notify Me » → Activer.",
    nm2: "Dis à ton Echo : « Alexa, open Notify Me » (en anglais).",
    nm3: "Tu reçois un courriel d'Amazon avec ton « access code ». Copie-le ici.",
    codeLabel: "Ton code Notify Me", nmHint: "Quand une alerte arrive, ton Echo s'allume en jaune. Demande : « Alexa, quelles sont mes notifications? »",
    vmTitle: "Option : Echo Show qui parle (Voice Monkey)",
    vmHint: "Seulement si tu as déjà un compte voicemonkey.io avec un appareil « Speaker ». Sinon, laisse vide.",
    vmToken: "Token Voice Monkey", vmDevice: "ID de l'appareil",
    make: "Créer mon code",
    s4: "Envoie-le", sendIt: "Envoie ce message à la personne qui t'a donné ce lien. C'est tout!",
    share: "Envoyer", copy: "Copier", copied: "Copié ✓",
    after: "Garde ce code pour toi : il permet d'envoyer des notifications à ton Echo.",
    errName: "Écris un nom (lettres ou chiffres).", errTown: "Choisis ta ville (étape 2).",
    errCode: "Colle ton code Notify Me (étape 3), ou remplis Voice Monkey.",
    errSearch: "Aucune ville trouvée. Vérifie l'orthographe ou utilise « Ta ville n'apparaît pas? ».",
    errNet: "La recherche ne marche pas en ce moment. Utilise « Ta ville n'apparaît pas? ».",
    picked: "Choisi : ", msgHead: "Ouvre les fenêtres : nouvelle maison", secretName: "Nom du secret", value: "Valeur",
  },
  en: {
    title: "Open the windows",
    lead: "Your Echo tells you when it's a good time to open the windows, and reminds you to close them before rain or cold. Takes 5 minutes.",
    s1: "Your name", nameLabel: "A name for your home", nameHint: "E.g. Mom, Julie, Cottage. Letters and numbers only.",
    s2: "Your town", townLabel: "Town name", search: "Search",
    manual: "Can't find your town?", lat: "Latitude", lon: "Longitude",
    manualHint: "In Google Maps, long-press your home: the two numbers at the top are latitude and longitude.",
    s3: "Your Echo",
    nm1: "In the Alexa app: More → Skills & Games → search \"Notify Me\" → Enable.",
    nm2: "Say to your Echo: \"Alexa, open Notify Me\".",
    nm3: "Amazon emails you an \"access code\". Paste it here.",
    codeLabel: "Your Notify Me code", nmHint: "When an alert arrives your Echo glows yellow. Ask: \"Alexa, what are my notifications?\"",
    vmTitle: "Optional: talking Echo Show (Voice Monkey)",
    vmHint: "Only if you already have a voicemonkey.io account with a \"Speaker\" device. Otherwise leave empty.",
    vmToken: "Voice Monkey token", vmDevice: "Device ID",
    make: "Make my code",
    s4: "Send it", sendIt: "Send this message to whoever gave you this link. That's it!",
    share: "Send", copy: "Copy", copied: "Copied ✓",
    after: "Keep this code private: it lets anyone send notifications to your Echo.",
    errName: "Type a name (letters or numbers).", errTown: "Pick your town (step 2).",
    errCode: "Paste your Notify Me code (step 3), or fill in Voice Monkey.",
    errSearch: "No town found. Check the spelling or use \"Can't find your town?\".",
    errNet: "Search isn't working right now. Use \"Can't find your town?\".",
    picked: "Picked: ", msgHead: "Open the windows: new home", secretName: "Secret name", value: "Value",
  },
};
let lang = "fr", place = null, message = "";
const $ = (id) => document.getElementById(id);

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T[lang][el.dataset.t]; });
  $("lang").textContent = lang === "fr" ? "English" : "Français";
  if (place) showPicked();
  if (message) build();
}
$("lang").onclick = () => { lang = lang === "fr" ? "en" : "fr"; render(); };

function slug(s) {
  return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase()
          .replace(/[^A-Z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 30);
}

async function search() {
  const q = $("town").value.trim();
  $("townErr").textContent = ""; $("places").innerHTML = "";
  if (!q) return;
  try {
    const url = "https://geocoding-api.open-meteo.com/v1/search?count=6&format=json&language=" + lang
              + "&name=" + encodeURIComponent(q);
    const j = await (await fetch(url)).json();
    if (!j.results || !j.results.length) { $("townErr").textContent = T[lang].errSearch; return; }
    j.results.forEach((r) => {
      const li = document.createElement("li"), b = document.createElement("button");
      b.type = "button";
      b.textContent = [r.name, r.admin1, r.country].filter(Boolean).join(", ");
      b.onclick = () => {
        place = { label: b.textContent, lat: r.latitude, lon: r.longitude, tz: r.timezone || "America/Toronto" };
        document.querySelectorAll(".places button").forEach((x) => x.setAttribute("aria-pressed", x === b));
        showPicked();
      };
      li.appendChild(b); $("places").appendChild(li);
    });
  } catch (e) { $("townErr").textContent = T[lang].errNet; $("manual").open = true; }
}
function showPicked() { $("townErr").textContent = ""; }
$("search").onclick = search;
$("town").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });

function where() {
  const lat = parseFloat($("lat").value.replace(",", ".")), lon = parseFloat($("lon").value.replace(",", "."));
  if ($("manual").open && isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
    return { lat, lon, tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "America/Toronto" };
  }
  return place;
}

function build() {
  const t = T[lang], name = $("name").value.trim(), id = slug(name), p = where();
  const code = $("code").value.trim(), vt = $("vmToken").value.trim(), vd = $("vmDevice").value.trim();
  const err = !id ? t.errName : !p ? t.errTown : !(code || (vt && vd)) ? t.errCode : "";
  $("makeErr").textContent = err;
  if (err) { $("result").style.display = "none"; message = ""; return; }
  const home = { name, lat: Math.round(p.lat * 100) / 100, lon: Math.round(p.lon * 100) / 100, tz: p.tz, mode: "auto" };
  if (code) home.notifyme = code;
  if (vt && vd) { home.vm_token = vt; home.vm_device = vd; }
  message = t.msgHead + "\n" + t.secretName + ": HOME_" + id + "\n" + t.value + ":\n" + JSON.stringify(home);
  $("out").textContent = message;
  $("share").style.display = navigator.share ? "" : "none";
  $("result").style.display = "block";
}
$("make").onclick = () => { build(); if (message) $("result").scrollIntoView({ behavior: "smooth" }); };

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(message); }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("out"));
              getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); }
  $("copied").textContent = T[lang].copied;
};
$("share").onclick = () => navigator.share({ text: message }).catch(() => {});

render();
</script>
</body>
</html>
