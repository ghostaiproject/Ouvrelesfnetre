<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ouvre les fenêtres</title>
<style>
  :root { --bg: #f6f4ef; --card: #ffffff; --ink: #1f2328; --muted: #5d6470; --line: #dedad2;
          --accent: #2f6f4f; --accent-ink: #ffffff; --soft: #e8f1ec; --sky: #dcecf5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181c; --card: #1e2227; --ink: #e8e6e3; --muted: #a0a6ae; --line: #33383f;
            --accent: #6fbf94; --accent-ink: #0f1a14; --soft: #1f2d26; --sky: #1b2a33; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 600px; margin: 0 auto; padding: 20px 16px 56px; }
  .top { display: flex; justify-content: flex-end; }
  .lang { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
          padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
  .hero { text-align: center; padding: 8px 0 18px; }
  .win { font-size: 54px; line-height: 1; }
  h1 { font-size: 1.9rem; line-height: 1.15; margin: 10px 0 8px; }
  .tag { color: var(--muted); margin: 0 auto; max-width: 30em; }
  h2 { font-size: 1.15rem; margin: 30px 0 12px; }
  .steps { display: grid; gap: 10px; }
  .step { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line);
          border-radius: 14px; padding: 14px; }
  .step .i { font-size: 26px; width: 36px; text-align: center; flex: none; }
  .step b { display: block; }
  .step span.d { color: var(--muted); font-size: .95rem; }
  .rules { background: var(--sky); border-radius: 14px; padding: 14px 16px; }
  .rules dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
  .rules dt { font-size: 20px; }
  .rules dd { margin: 0; }
  .rules p { margin: 12px 0 0; font-size: .92rem; color: var(--muted); }
  .opts { display: grid; gap: 12px; }
  @media (min-width: 560px) { .opts { grid-template-columns: 1fr 1fr; } }
  .opt { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 16px;
         display: flex; flex-direction: column; }
  .opt.main { border-color: var(--accent); }
  .badge { align-self: flex-start; font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
           background: var(--soft); color: var(--accent); border-radius: 999px; padding: 3px 10px; }
  .opt h3 { margin: 10px 0 2px; font-size: 1.15rem; display: flex; gap: 8px; align-items: center; }
  .opt .need { color: var(--muted); font-size: .9rem; margin: 0 0 8px; }
  .opt ul { margin: 0 0 14px; padding-left: 20px; flex: 1; }
  .opt li { margin: 3px 0; }
  .go { display: block; text-align: center; text-decoration: none; font-weight: 700; border-radius: 10px; padding: 12px;
        background: var(--accent); color: var(--accent-ink); }
  .go.alt { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .fine { color: var(--muted); font-size: .9rem; margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; }
  .fine p { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <div class="top"><button class="lang" id="lang" type="button">English</button></div>

  <div class="hero">
    <div class="win" aria-hidden="true">🪟</div>
    <h1 data-t="title"></h1>
    <p class="tag" data-t="tag"></p>
  </div>

  <h2 data-t="howTitle"></h2>
  <div class="steps">
    <div class="step"><span class="i">🌤️</span><span><b data-t="h1"></b><span class="d" data-t="h1d"></span></span></div>
    <div class="step"><span class="i">🔔</span><span><b data-t="h2"></b><span class="d" data-t="h2d"></span></span></div>
    <div class="step"><span class="i">🌧️</span><span><b data-t="h3"></b><span class="d" data-t="h3d"></span></span></div>
    <div class="step"><span class="i">😄</span><span><b data-t="h4"></b><span class="d" data-t="h4d"></span></span></div>
  </div>

  <h2 data-t="goodTitle"></h2>
  <div class="rules">
    <dl>
      <dt>🌡️</dt><dd data-t="r1"></dd>
      <dt>💧</dt><dd data-t="r2"></dd>
      <dt>☔</dt><dd data-t="r3"></dd>
      <dt>🍃</dt><dd data-t="r4"></dd>
      <dt>🕛</dt><dd data-t="r5"></dd>
    </dl>
    <p data-t="rNote"></p>
  </div>

  <h2 data-t="pickTitle"></h2>
  <div class="opts">
    <div class="opt main">
      <span class="badge" data-t="echoBadge"></span>
      <h3>🔵 <span data-t="echoTitle"></span></h3>
      <p class="need" data-t="echoNeed"></p>
      <ul><li data-t="e1"></li><li data-t="e2"></li><li data-t="e3"></li></ul>
      <a class="go" href="echo.html" data-t="echoGo"></a>
    </div>
    <div class="opt">
      <span class="badge" data-t="phoneBadge"></span>
      <h3>📱 <span data-t="phoneTitle"></span></h3>
      <p class="need" data-t="phoneNeed"></p>
      <ul><li data-t="p1"></li><li data-t="p2"></li><li data-t="p3"></li></ul>
      <a class="go alt" href="phone.html" data-t="phoneGo"></a>
    </div>
  </div>

  <div class="fine">
    <p data-t="f1"></p>
    <p data-t="f2"></p>
    <p data-t="f3"></p>
  </div>
</main>
<script>
const T = {
  fr: {
    title: "Ouvre les fenêtres",
    tag: "Un petit service gratuit qui te dit quand il fait assez doux et sec pour aérer, et quand refermer.",
    howTitle: "Comment ça marche",
    h1: "La météo de ta ville, aux 15 minutes", h1d: "Température, humidité, pluie et vent, vérifiés pour ton coin.",
    h2: "Une alerte quand c'est le bon moment", h2d: "Au maximum une fois par jour, pour ne pas te harceler.",
    h3: "Un rappel pour fermer", h3d: "Si la pluie s'en vient ou qu'il commence à faire froid, après une alerte d'ouverture.",
    h4: "Avec une blague de fenêtre", h4d: "Selon la météo et les fêtes, en français ou en anglais.",
    goodTitle: "C'est quoi, un bon moment?",
    r1: "Entre 15 et 22 °C, sans descendre sous 13 °C bientôt",
    r2: "Humidité entre 30 et 65 %, pas de point de rosée collant",
    r3: "Pas de pluie maintenant ni dans les 2 prochaines heures",
    r4: "Vent sous 30 km/h",
    r5: "Semaine : à midi ou à 17 h. Fin de semaine : entre 8 h et 20 h",
    rNote: "Les rappels pour fermer arrivent seulement entre 7 h et 23 h. Jamais la nuit.",
    pickTitle: "Choisis ton option",
    echoBadge: "Recommandé", echoTitle: "Amazon Echo", echoNeed: "Tu as un Echo (Alexa) à la maison. 5 minutes.",
    e1: "L'Echo s'allume en jaune quand c'est le temps",
    e2: "Option : il dit l'alerte à voix haute (Echo Show : à l'écran aussi)",
    e3: "Demande « Alexa, quelles sont mes notifications? »",
    echoGo: "Configurer mon Echo →",
    phoneBadge: "Pas d'Echo?", phoneTitle: "Ton téléphone", phoneNeed: "Android ou iPhone, rien d'autre. 3 minutes.",
    p1: "Une notification avec l'app gratuite ntfy",
    p2: "Option : ton téléphone la lit à voix haute (MacroDroid, Android)",
    p3: "Marche partout où ton téléphone a Internet",
    phoneGo: "Configurer mon téléphone →",
    f1: "💸 Gratuit. Aucun compte à créer chez nous.",
    f2: "📍 Seule ta ville est utilisée, arrondie à environ 100\u00a0m.",
    f3: "🔒 Ton code reste privé : il sert seulement à t'envoyer tes alertes.",
  },
  en: {
    title: "Open the windows",
    tag: "A small free service that tells you when it's mild and dry enough to air out, and when to close up.",
    howTitle: "How it works",
    h1: "Your town's weather, every 15 minutes", h1d: "Temperature, humidity, rain and wind, checked for your area.",
    h2: "An alert when it's the right moment", h2d: "At most once a day, so it never nags.",
    h3: "A reminder to close", h3d: "If rain is coming or it's getting cold, after an open alert.",
    h4: "With a window joke", h4d: "Matched to the weather and holidays, in French or English.",
    goodTitle: "What's a good moment?",
    r1: "Between 15 and 22 °C, not dropping under 13 °C soon",
    r2: "Humidity between 30 and 65 %, no sticky dew point",
    r3: "No rain now or in the next 2 hours",
    r4: "Wind under 30 km/h",
    r5: "Weekdays: at noon or 5 pm. Weekends: between 8 am and 8 pm",
    rNote: "Close reminders only come between 7 am and 11 pm. Never at night.",
    pickTitle: "Pick your option",
    echoBadge: "Recommended", echoTitle: "Amazon Echo", echoNeed: "You have an Echo (Alexa) at home. 5 minutes.",
    e1: "Your Echo glows yellow when it's time",
    e2: "Optional: it says the alert out loud (Echo Show: on screen too)",
    e3: "Ask \"Alexa, what are my notifications?\"",
    echoGo: "Set up my Echo →",
    phoneBadge: "No Echo?", phoneTitle: "Your phone", phoneNeed: "Android or iPhone, nothing else. 3 minutes.",
    p1: "A notification through the free ntfy app",
    p2: "Optional: your phone reads it out loud (MacroDroid, Android)",
    p3: "Works anywhere your phone has internet",
    phoneGo: "Set up my phone →",
    f1: "💸 Free. No account to create with us.",
    f2: "📍 Only your town is used, rounded to about 100\u00a0m.",
    f3: "🔒 Your code stays private: it's only used to send you your alerts.",
  },
};
let lang = "fr";
function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T[lang][el.dataset.t]; });
  document.getElementById("lang").textContent = lang === "fr" ? "English" : "Français";
}
document.getElementById("lang").onclick = () => { lang = lang === "fr" ? "en" : "fr"; render(); };
render();
</script>
</body>
</html>
