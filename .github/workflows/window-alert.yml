name: window-alert

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off the :00 rush
  workflow_dispatch:   # tapping "Run workflow" = send ONE test alert now
    inputs:
      home:
        description: "Which home gets the test: main (yours), a name like mom, or all"
        default: main

permissions:
  contents: write

concurrency:
  group: window-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytest
      - run: pytest -q
      - name: Run alert
        env:
          MODE: ${{ vars.MODE || 'auto' }}
          VOICEMONKEY_CHIME: ${{ vars.VOICEMONKEY_CHIME }}
          DRY_RUN: "0"
          FORCE_TEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          VOICEMONKEY_TOKEN: ${{ secrets.VOICEMONKEY_TOKEN }}
          VOICEMONKEY_DEVICE: ${{ secrets.VOICEMONKEY_DEVICE }}
          NOTIFYME_ACCESS_CODE: ${{ secrets.NOTIFYME_ACCESS_CODE }}
          TEST_HOME: ${{ inputs.home }}
          ALL_SECRETS: ${{ toJSON(secrets) }}   # every HOME_<NAME> secret = one more home
        run: python alert.py
      - name: Save state
        if: always()   # other homes' state still saves if one home failed
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "window-alert-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git commit -m "state update"
            git pull --rebase -q
            git push
          fi
